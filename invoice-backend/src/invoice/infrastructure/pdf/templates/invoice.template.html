<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Invoice Template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      padding: 2rem;
      min-height: 297mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      align-items: start;
    }

    .value {
      display: block;
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      margin: 0.25rem 0;
      color: #333;
    }

    .value.large {
      font-size: 1rem;
      font-weight: bold;
      color: #2563EB;
    }

    label {
      font-weight: 600;
    }

    .flex {
      display: flex;
      align-items: center;
    }

    .flex-col {
      display: flex;
      flex-direction: column;
    }

    .flex-row-reverse {
      display: flex;
      flex-direction: row-reverse;
    }

    .gap-2 {
      gap: 0.5rem;
    }

    .mt-3 {
      margin-top: 0.75rem;
    }

    .bg-gray-700 {
      background-color: #374151;
    }

    .text-white {
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.25rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      font-weight: 500;
    }

    hr {
      border: none;
      border-top: 1px solid #d1d5db;
      margin-top: 0.25rem;
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Header -->
    <div class="grid-2">
      <div>
        {{logo}}
        <div>
          <span class="value">{{website}}</span>
          <span class="value">{{email}}</span>
        </div>
      </div>
      <div>
        <div style="display:flex; justify-content:flex-end; align-items:center;">
          <label style="font-weight:600; font-size:1.125rem; margin-right:0.25rem;">InvoiceNo</label>
          <span class="value large" style="width:8rem;">{{invoiceNo}}</span>
        </div>
        <div style="display:flex; justify-content:flex-end; margin-top:0.75rem; gap:0.5rem;">
          <div class="flex-col">
            <label>Invoice Date</label>
            <span class="value">{{invoiceDate}}</span>
          </div>
          <div class="flex-col">
            <label>Due Date</label>
            <span class="value">{{dueDate}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Billed by / Billed to -->
    <div class="grid-2" style="margin-top:2rem; margin-bottom:2rem;">
      {{billedBy}}
      {{billedTo}}
    </div>

    <!-- Items table -->
    <div>
      <table>
        <thead class="bg-gray-700 text-white">
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          {{items}}
        </tbody>
      </table>
    </div>

    <!-- Pricing + Notes -->
    <div style="margin-top:auto; padding-top:1rem;">

      <!-- Pricing -->
      <div class="flex-row-reverse">
        <div
          style="width:32%; border:.7px solid #e5e7eb; border-radius:0.75rem; padding:0.75rem; background-color:#ffffff;">
          <div style="display:flex; justify-content:space-between;">
            <p style="font-size:0.9rem; color:#6b7280;">Subtotal</p>
            <p style="width:8rem; text-align:right; font-size:0.9rem;">{{subtotal}}</p>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top:0.15rem;">
            <p style="font-size:0.9rem; color:#6b7280;">Tax</p>
            <p style="width:8rem; text-align:right; font-size:0.9rem;">{{tax}}</p>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top:0.15rem;">
            <p style="font-size:0.9rem; color:#6b7280;">Discount</p>
            <p style="width:8rem; text-align:right; font-size:0.9rem;">{{discount}}</p>
          </div>
          <div
            style="display:flex; justify-content:space-between; margin-top:0.15rem; background-color:#f9fafb; padding:0.3rem; border-radius:0.375rem;">
            <p style="font-size:0.9rem; font-weight:600; color:#374151;">Total</p>
            <p style="font-size:0.9rem; font-weight:600; color:#374151;">{{total}}</p>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div style="margin-top:0.75rem;">
        <p style="font-size:0.75rem; color:#4b5563; font-weight:300; margin-bottom:0.25rem;">Notes</p>
        <p style="font-size:0.75rem; color:#333;">{{notes}}</p>
      </div>

    </div>

  </div>
</body>

</html>
